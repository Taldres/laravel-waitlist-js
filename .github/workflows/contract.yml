name: contract

# The client against a live Laravel Waitlist API, served by Testbench on SQLite,
# so a change on either side that breaks the other fails. The API comes from its
# main branch; a pull request whose branch also exists in the API repository is
# tested against that branch, so a change that spans both is green before the API
# side is merged.
on:
  push:
    branches: [main]
    # Changes the live API cannot notice: docs, agent skills and repository settings.
    paths-ignore:
      - "**.md"
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - ".cursor/**"
      - ".junie/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/dependabot.yml"
      - ".github/release.yml"
  pull_request:
    paths-ignore:
      - "**.md"
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - ".cursor/**"
      - ".junie/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/dependabot.yml"
      - ".github/release.yml"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      api-ref:
        description: Branch of laravel-waitlist to test against
        default: main

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Choose the API branch
        env:
          INPUT_REF: ${{ inputs.api-ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          ref="${INPUT_REF:-main}"
          if [ -n "$HEAD_REF" ] && git ls-remote --exit-code --heads https://github.com/Taldres/laravel-waitlist.git "refs/heads/$HEAD_REF" > /dev/null; then
            ref="$HEAD_REF"
          fi
          echo "Testing against laravel-waitlist $ref"
          if [ "$ref" != "main" ]; then
            # Straight from GitHub: Packagist may not know a new branch yet.
            composer config --working-dir=contract repositories.api vcs https://github.com/Taldres/laravel-waitlist.git
            composer require --working-dir=contract --no-update "taldres/laravel-waitlist:dev-$ref"
          fi

      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
        run: |
          pnpm install --frozen-lockfile
          composer update --working-dir=contract --no-interaction --prefer-dist --no-progress

      - name: Start the API
        run: |
          composer --working-dir=contract build
          composer --working-dir=contract serve > "$RUNNER_TEMP/api.log" 2>&1 &
          curl --silent --fail --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/up > /dev/null

      - name: Contract tests
        run: pnpm test:contract

      - name: Show the API log
        if: failure()
        run: cat "$RUNNER_TEMP/api.log" contract/vendor/orchestra/testbench-core/laravel/storage/logs/*.log || true
