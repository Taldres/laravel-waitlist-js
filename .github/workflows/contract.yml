name: contract

# The client against a live Laravel Waitlist API from its main branch, served
# by Testbench on SQLite, so a change on either side that breaks the other fails.
on:
  push:
    branches: [main]
    # Changes the live API cannot notice: docs, agent skills and repository settings.
    paths-ignore:
      - "**.md"
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - ".cursor/**"
      - ".junie/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/dependabot.yml"
      - ".github/release.yml"
  pull_request:
    paths-ignore:
      - "**.md"
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - ".cursor/**"
      - ".junie/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/dependabot.yml"
      - ".github/release.yml"
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          composer update --working-dir=contract --no-interaction --prefer-dist --no-progress

      - name: Start the API
        run: |
          composer --working-dir=contract build
          composer --working-dir=contract serve > "$RUNNER_TEMP/api.log" 2>&1 &
          curl --silent --fail --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/up > /dev/null

      - name: Contract tests
        run: pnpm test:contract

      - name: Show the API log
        if: failure()
        run: cat "$RUNNER_TEMP/api.log" contract/vendor/orchestra/testbench-core/laravel/storage/logs/*.log || true
